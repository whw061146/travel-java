spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travel_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api

# JWT配置
jwt:
  secret: travelPlannerSecretKey
  expiration: 86400000 # 24小时

# Kimi API配置
kimi:
  api:
    url: https://kimi.moonshot.cn/api
    key: your_kimi_api_key_here
    model: moonshot-v1-8k